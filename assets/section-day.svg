<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="A DAY AT WORK">
<style>
@font-face{font-family:'Syne';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}

.n{font:700 30px 'Syne';fill:#CAF029}
.t{font:700 30px 'Syne';fill:#8C8C96;letter-spacing:.5px}
.s{animation:sweep 5s cubic-bezier(.6,0,.2,1) infinite}
@keyframes sweep{0%{transform:translateX(0);opacity:0}10%{opacity:1}80%{opacity:1}100%{transform:translateX(736px);opacity:0}}
@media (prefers-reduced-motion:reduce){.s{animation:none}}
</style>
<text x="4" y="54"><tspan class="n">02</tspan><tspan class="t" dx="16">A DAY AT WORK</tspan></text>
<rect x="374" y="43" width="822" height="2" rx="1" fill="#2A2A31"/>
<rect class="s" x="374" y="42" width="90" height="4" rx="2" fill="#CAF029"/>
</svg>